<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置工作台缓存</title>
<style>
body { font-family: sans-serif; padding: 40px 20px; text-align: center; background: #f5efe0; color: #4a4338; }
h1 { color: #7fa66f; }
.btn { display: inline-block; padding: 12px 24px; background: #7fa66f; color: white; border-radius: 8px; text-decoration: none; margin: 8px; font-weight: 600; }
.status { background: white; padding: 16px; border-radius: 8px; margin: 20px 0; }
.ok { color: #5a9e6e; font-weight: 600; }
</style>
</head>
<body>
<h1>🔄 重置工作台缓存</h1>
<p>这个页面会清除旧的工作台缓存,然后跳转到最新版</p>
<div class="status" id="status">正在清除...</div>
<button class="btn" onclick="resetCache()">清除缓存并跳转</button>
<a class="btn" href="https://hUi0343.github.io/hui-workbench/workbench.html">不清理,直接进入</a>
<script>
function resetCache() {
  document.getElementById('status').innerHTML = '⏳ 正在清除所有缓存...';
  // 1. 注销所有 service worker
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
      document.getElementById('status').innerHTML += '<br>✅ Service Worker 已注销';
    });
  }
  // 2. 清空所有 cache storage
  if (caches) {
    caches.keys().then(keys => {
      keys.forEach(k => caches.delete(k));
      document.getElementById('status').innerHTML += '<br>✅ Cache Storage 已清空';
    });
  }
  // 3. 清空 localStorage
  try { localStorage.clear(); document.getElementById('status').innerHTML += '<br>✅ LocalStorage 已清空'; } catch(e) {}
  // 4. 3 秒后跳转
  setTimeout(() => {
    document.getElementById('status').innerHTML = '<span class="ok">✅ 全部清理完成!3秒后跳转新版...</span>';
    setTimeout(() => {
      window.location.href = 'https://hUi0343.github.io/hui-workbench/workbench.html?v=clean';
    }, 3000);
  }, 1000);
}
</script>
</body>
</html>
